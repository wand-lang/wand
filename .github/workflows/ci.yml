name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read, and nothing else. Without a block the token takes the repository
# default, which is whatever the settings page says today rather than what
# this file asks for. Every other workflow here already declares its own.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung runner should fail in minutes, not sit for GitHub's six-hour
    # default: a cold-cache toolchain setup fits inside this severalfold,
    # and setup-ocaml has hung indefinitely (2026-08-19).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: "5.x"

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      # Covers the test suites, the examples (typechecked, and the hermetic
      # ones executed), the stdlib linting clean, and the reference documenting
      # exactly the rules that exist.
      - name: Test
        run: opam exec -- dune test

      # The same fixtures `dune test` gates, run the other way: through the
      # binary's own `wand s`, which is what CLAUDE.md tells a developer to
      # run and what a user of the language runs. `dune test` reaches them
      # through the library API, so a break confined to the CLI path -- the
      # runner refusing a file, the exit code, the discovery -- would not show
      # up there. Cheap, and it keeps the documented loop honest.
      - name: Run the wand-level suite through the CLI
        run: |
          set -euo pipefail
          _build/default/bin/wand.exe s test/wand

      # The shell-dependent examples are only typechecked by the suite, since
      # the test sandbox is not a git repository. Here the checkout is one, so
      # they can be run for real.
      - name: Run shell-dependent examples
        run: |
          set -euo pipefail
          WAND=_build/default/bin/wand.exe
          git config --global --add safe.directory "$PWD"
          "$WAND" examples/sysinfo.wand
          "$WAND" examples/repo-status.wand
          "$WAND" examples/party.wand
          printf 'INFO a\nERROR b\n' | "$WAND" examples/log-summary.wand

      # The demos are acceptance tests: if one stops making its point,
      # something regressed. 09 is left out of this step -- it deliberately
      # runs a bash loop that takes half a minute -- and runs below instead.
      - name: Run demos
        run: |
          set -euo pipefail
          demos/01-unset-variable/run.sh
          demos/02-domain-types/run.sh
          demos/03-typed-holes/run.sh
          demos/04-signatures/run.sh
          demos/05-rehearse/run.sh
          demos/06-unplugged/run.sh
          demos/07-jq-typed/run.sh
          demos/08-fan-out/run.sh
          demos/10-streams/run.sh

      # 09 at a tenth of its usual input. Its point -- a bash loop losing to
      # everything by orders of magnitude -- is visible at any size; the big
      # number is for a human reading it. Run small, so a signature change
      # here fails in CI rather than in the demo nobody ran.
      - name: Run demo 09 at a size CI can afford
        run: N=500 demos/09-fork-overhead/run.sh

      # wand f is the canonical form: running it on a formatted tree changes
      # nothing. Checked on a copy so a failure reports rather than rewrites.
      #
      # The check itself is a wand script. It runs here, after the suites,
      # rather than earlier: the binary it uses is the one this build just
      # produced, so anything ahead of it has to be able to fail without a
      # wand script running at all.
      - name: Check the tree is formatted
        env:
          WAND: ${{ github.workspace }}/_build/default/bin/wand.exe
        run: $WAND tools/check_fmt.wand

      # An example in a doc string is read by someone deciding how to call a
      # function, and one that is wrong is read with the same trust as one
      # that is right. Every one of them is run here.
      - name: Check the examples in the doc strings
        env:
          WAND: ${{ github.workspace }}/_build/default/bin/wand.exe
        run: $WAND tools/check_docs.wand

      # setup-wand's test suite is written in wand and is the only wand code
      # that exercises an installed binary the way a user meets it. Nothing
      # in that repository runs against an unreleased wand, so a change here
      # could break it and nobody would know until the next release. Run it
      # against this build.
      # Pinned to a commit, not to a branch. That suite is wand code and wand
      # code runs shell, so checking out the default branch made a push to
      # another repository a command running in this one. Moving it forward
      # is then a commit here, which is where a change to what CI runs
      # belongs. Bump the SHA when that repository has something this build
      # should be tested against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wand-lang/setup-wand
          ref: eb3b29225788c6a5669bce3ecc5e73b97dd7968a # main, 2026-09-08
          path: .setup-wand

      - name: Run setup-wand's suite against this build
        run: |
          set -euo pipefail
          WAND="$PWD/_build/default/bin/wand.exe"
          export PATH="$(dirname "$WAND"):$PATH"
          # The suite calls `wand`, so it has to find this build rather than
          # anything else on PATH -- and the copy in _build is wand.exe.
          ln -sf "$WAND" "$(dirname "$WAND")/wand"
          cd .setup-wand
          EXPECTED_VERSION="$(cat ../VERSION)" wand s test

  # The install script, against the release people get today.
  #
  # A job of its own, because it tests neither this build nor this
  # repository's code: it downloads the current release and runs the script
  # a new user runs. What it catches is drift the other way from the job in
  # release.yml -- install.sh breaking against what is already published,
  # with no new release involved.
  #
  # It is also the only place the version-resolution path runs. release.yml
  # pins WAND_VERSION, so nothing there parses the /releases/latest
  # redirect that a bare `sh install.sh` depends on.
  #
  # It downloads from GitHub, so an outage there turns this red for a reason
  # that has nothing to do with the code. That is the cost of testing the
  # path a user actually takes.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The published install script installs the latest release
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wand-latest"
          WAND_INSTALL_DIR="$dir" sh install.sh

          # Whatever `latest` resolved to, the binary has to say the same
          # number the script said it installed.
          got=$("$dir/wand" version 2>/dev/null || "$dir/wand" V 2>/dev/null)
          case "$got" in
            "wand "*) echo "installed $got" ;;
            *) echo "::error::the installed binary reported '$got'" >&2; exit 1 ;;
          esac

          cd "$RUNNER_TEMP"
          out=$("$dir/wand" -e '1 + 1' 2>/dev/null || "$dir/wand" e '1 + 1')
          test "$out" = "2 : Int" || {
            echo "::error::the installed binary answered '$out' to 1 + 1" >&2
            exit 1
          }

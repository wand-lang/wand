# The fuzzer, given time. `dune test` runs the reproducers it has already
# filed; this is the half that looks for new ones, and it looks for as long
# as a scheduled job can afford.
#
# A scheduled workflow only ever runs from the default branch, and GitHub
# disables one after 60 days without a push -- so a quiet month turns this
# off silently. `workflow_dispatch` is here to run it by hand, with a seed,
# which is also how a red run is reproduced.

name: Fuzz

on:
  schedule:
    # Twice a day, twelve hours apart. Nothing depends on the exact times;
    # each run takes under an hour, so two cannot overlap. GitHub runs a
    # schedule hours late under load, and the queue holds a second run
    # rather than dropping it; `workflow_dispatch` is there for a run now.
    - cron: "37 7 * * *"
    - cron: "37 19 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to start from (blank uses the run id)"
        required: false
        default: ""
      minutes:
        description: "Minutes per shard"
        required: false
        default: "45"

permissions:
  contents: read
  issues: write

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Four seeds rather than one long run: the mutations are independent,
      # so four hours of wall clock in one hour is four times the inputs,
      # and a shard that finds something does not stop the others.
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3
        with:
          ocaml-compiler: "5.x"

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      # The seed is the run id plus the shard, so it is different every
      # run, recorded in the run, and enough on its own to replay a
      # finding: `fuzz --seed S --only I`. A finding's notes carry both.
      #
      # Both arrive through `env:`, never substituted into the script: a
      # `${{ }}` in a `run:` block is pasted into the source the shell reads,
      # so a dispatch input becomes shell to run.
      #
      # A variable is not enough on its own here. `$(( ))` evaluates what a
      # variable holds, and `a[$(cmd)]` runs the command inside arithmetic
      # whether or not the expansion is quoted -- so each number is checked
      # for being one before it reaches the arithmetic.
      - name: Fuzz
        id: fuzz
        env:
          SEED_INPUT: ${{ github.event.inputs.seed }}
          RUN_ID: ${{ github.run_id }}
          SHARD: ${{ matrix.shard }}
          MINUTES_INPUT: ${{ github.event.inputs.minutes }}
        run: |
          # No -e: a finding is a non-zero exit from the fuzzer, and this
          # step has to record it rather than die on it. The last step of
          # the job is what turns it into a red run.
          set +e
          set -uo pipefail
          digits() {
            case "$1" in
              "" | *[!0-9]*) echo "::error::$2 must be digits, got: $1" >&2; exit 1 ;;
            esac
          }
          BASE="$SEED_INPUT"
          if [ -z "$BASE" ]; then BASE="$RUN_ID"; fi
          MINUTES="$MINUTES_INPUT"
          if [ -z "$MINUTES" ]; then MINUTES=45; fi
          digits "$BASE" seed
          digits "$MINUTES" minutes
          digits "$SHARD" shard
          SEED=$(( BASE + SHARD ))
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          _build/default/test/fuzz/fuzz.exe \
            --seed "$SEED" \
            --iterations 100000000 \
            --seconds $(( MINUTES * 60 )) \
            --timeout 20 \
            --shrink 2000 \
            | tee fuzz.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Uploaded whether or not anything was found: the log is the record of
      # how many inputs a run actually got through, which is the only way
      # to notice the fuzzer quietly slowing down or stopping early.
      - name: Keep the findings and the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-${{ matrix.shard }}
          path: |
            _fuzz-findings/
            fuzz.log
          if-no-files-found: warn

      - name: Fail if the shard found something new
        if: steps.fuzz.outputs.status != '0'
        env:
          SEED: ${{ steps.fuzz.outputs.seed }}
        run: |
          echo "seed $SEED found something new" >&2
          exit 1

  # One job after all four, so a signature two shards hit becomes one issue
  # rather than two.
  report:
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: findings

      # One issue per signature, and the title is the signature -- so the
      # second run a bug survives updates nothing and files nothing. The
      # body carries the replay line and the shrunk input, which is all
      # anyone needs to start.
      - name: File an issue for each new signature
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The label has to exist before an issue can carry it, and a
          # fresh clone of this repository has no reason to have it.
          gh label create fuzz --description "Found by the fuzzer" \
            --color FBCA04 2>/dev/null || true

          # Every title with an issue still open, read once, from the
          # issues endpoint.
          #
          # Listing, not search: search is indexed asynchronously, so two
          # shards hitting one signature seconds apart both find nothing and
          # both file. Listing is read-your-writes, and a title filed in this
          # run is added below, so the second shard sees the first shard's
          # issue whatever the index is doing.
          #
          # Open, not all. A closed issue says the bug is fixed, so the same
          # signature arriving again is a regression or a second bug wearing
          # the first one's name -- the two things most worth being told
          # about. Counting closed issues as filed hid four `format:unstable`
          # findings behind an issue closed hours earlier, and they surfaced
          # only because someone downloaded the artifacts. A bug that is
          # known and not being fixed belongs in test/fuzz/known.txt, which
          # keeps the run green without hiding anything.
          gh issue list --label fuzz --state open --limit 500 \
            --json title --jq '.[].title' > filed.txt

          # A fence longer than the longest run of backticks in the text it
          # wraps. A finding is arbitrary bytes -- the fuzzer writes them --
          # and one holding ``` closed the block early, so the rest of the
          # input rendered as prose and the issue misreported the reproducer.
          fence() {
            longest=$(grep -ao '`\+' "$1" | awk '{ print length }' | sort -rn | head -1)
            printf '%*s\n' "$(( ${longest:-0} < 3 ? 3 : longest + 1 ))" '' | tr ' ' '`'
          }

          filed=0
          unfiled=0
          for notes in findings/*/_fuzz-findings/*.json; do
            input="${notes%.json}.wand"
            sig=$(jq -r '.signature' "$notes")
            [ -n "$sig" ] && [ "$sig" != "null" ] || continue
            title="fuzz: $sig"
            if grep -Fxq "$title" filed.txt; then
              echo "already filed: $title"
              continue
            fi
            notes_fence=$(fence "$notes")
            input_fence=$(fence "$input")
            {
              echo "Found by the fuzzer (\`$WORKFLOW\`, run [$RUN_ID]($SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID))."
              echo
              echo "${notes_fence}json"
              cat "$notes"
              echo "$notes_fence"
              echo
              echo "Input:"
              echo
              echo "$input_fence"
              cat "$input"
              echo "$input_fence"
              echo
              echo "If this is not going to be fixed now, put the signature in"
              echo "\`test/fuzz/known.txt\` so the next run is green. When it is fixed,"
              echo "put the input in \`test/fuzz/regressions/\`."
            } > body.md
            # One failure is one finding, not the rest of them. Under `set -e`
            # a refused `gh issue create` -- invalid UTF-8 in a body, a rate
            # limit, a network blip -- ended the loop, and every finding after
            # it existed only in the artifacts, with nothing saying so.
            if gh issue create --title "$title" --body-file body.md --label fuzz; then
              # Before the next shard's finding is considered, not after the
              # loop: the duplicate this guards against is inside one run.
              printf '%s\n' "$title" >> filed.txt
              filed=$((filed + 1))
            else
              echo "::warning::could not file an issue for: $title"
              unfiled=$((unfiled + 1))
            fi
          done
          echo "filed $filed issue(s)"
          if [ "$unfiled" -gt 0 ]; then
            echo "::error::$unfiled finding(s) could not be filed; they are in the artifacts" >&2
            exit 1
          fi

name: Release

# Tagging publishes. `workflow_dispatch` builds and uploads the same
# artifacts without creating a release, which is how the matrix gets checked
# before a tag makes it permanent.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Per job, because the two jobs need different things and the build job is
# the one that runs a whole toolchain. Building needs to read the repository
# and to sign; only the job that attaches archives needs to write a release.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # `id-token` is the OIDC token the attestation is signed with, and
    # `attestations` is what stores the result against this repository.
    # Neither can write to the repository or to a release.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # See ci.yml: a hung runner fails in minutes, not GitHub's six hours.
    # 45: one musl attempt is about eight minutes and the step retries
    # up to three times.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # OCaml has no cross-compilation worth relying on: ocamlopt emits
          # code for the machine it was built for, and every dependency would
          # have to be rebuilt for the target. So each artifact is built on
          # its own hardware.
          #
          # macOS x86_64 is missing on purpose. Its runner never leaves the
          # queue, and `make release` builds that archive on a developer's
          # Intel Mac and attaches it to the same draft release.
          - target: linux-x86_64
            runs-on: ubuntu-latest
            static: true
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            static: true
          - target: macos-aarch64
            runs-on: macos-15
            static: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Linux binaries are built inside Alpine and linked statically
      # against musl, so they run wherever they are copied. The image is
      # multi-arch, so the same reference builds natively on both runners.
      # Docker is driven directly rather than through `container:`, which
      # would put the checkout and the image's `opam` user at odds.
      # An OCaml 5 runtime older than 5.5.1 sizes its alternate signal
      # stack from the build-time SIGSTKSZ, which musl fixes at 8192. The
      # kernel asks for more than that on a CPU with AMX -- 11952 on the
      # Xeons GitHub runs -- and musl 1.2.6 checks the request against the
      # kernel's number and answers ENOMEM. The runtime then prints
      #
      #   Fatal error: Failed to allocate signal stack for domain 0
      #
      # and aborts. This is deterministic per machine, not a flake: about
      # one runner in eight is such a machine, and every start on one of
      # them fails. It killed the build while opam compiled dune, and it
      # killed the *shipped* binary for anyone on AMX hardware.
      #
      # OCaml 5.5.1 reads sysconf(_SC_SIGSTKSZ) instead, so the switch
      # below is made here rather than taken from the image: 5.5.1 is new
      # and no opam image carries it yet -- alpine-ocaml-5.5 is still
      # 5.5.0, which does not have the fix. Drop the switch once a base
      # image ships 5.5.1 or later.
      #
      # musl 1.2.6 is right to refuse, so the answer is not an older Alpine.
      # 8192 really is too small there, and musl 1.2.5 and glibc both accept
      # it silently -- which trades an abort at startup for a signal frame
      # written past the end of the stack.
      #
      # The retry stays, but it cannot help this: it re-runs on the same
      # machine, and the failure is a property of the machine. Only a new
      # VM clears it, which is `gh run rerun`. Until the base image carries
      # 5.5.1 the *build* still needs a non-AMX runner; the artifact it
      # produces is correct everywhere, which is the half that reaches
      # users.
      #
      # Pinned by digest, not by tag. `alpine-ocaml-5.4` moves: it is rebuilt
      # with a newer opam repository snapshot whenever one lands, so two
      # releases cut a day apart are built by two different toolchains and
      # neither says so. This digest is the image that built 0.55.0.
      #
      # To move it: read `Digest: sha256:...` from a run that worked.
      - name: Build (Linux, static musl)
        if: matrix.static
        run: |
          set -euo pipefail
          attempt=1
          until docker run --rm -v "$PWD:/src" -w /src \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            ocaml/opam:alpine-ocaml-5.4@sha256:8e26f87086ac85e521889b26b35709220bdd13b2019a1524157e6de5caf3cff4 sh -c '
              set -eu
              sudo chown -R opam:opam /src
              sudo apk add --no-cache musl-dev
              # The image carries opam-repository as a local clone frozen
              # when the image was built, so `opam update` finds nothing and
              # 5.5.1 is not there. Point it at a commit of the real one --
              # a commit rather than a branch, for the same reason the image
              # is a digest rather than a tag: two releases cut a day apart
              # should not be built from two different package sets without
              # saying so. This commit is 2026-09-08 and has 5.5.1.
              opam repository set-url default \
                git+https://github.com/ocaml/opam-repository.git#bbc595948dff71b5d1203200377ff7ee18745215
              opam update -y
              opam switch create build ocaml-base-compiler.5.5.1 -y
              eval $(opam env --switch=build --set-switch)
              ocamlopt -version
              opam install . --deps-only
              opam exec -- dune build --profile static bin/wand.exe
              # A downloaded binary is read by nothing that wants symbols,
              # and stripping takes it from 7.3 MB to 3.0 MB.
              sudo strip _build/default/bin/wand.exe
              # Handing the tree back, so the steps after this one -- and the
              # checkout action cleaning up after itself -- still own it.
              sudo chown -R "$HOST_UID:$HOST_GID" /src
            '
          do
            if [ "$attempt" -ge 3 ]; then
              echo "the musl build failed $attempt times; that is not the flake" >&2
              exit 1
            fi
            echo "musl build failed (attempt $attempt), trying again" >&2
            attempt=$((attempt + 1))
          done

      - name: Set up OCaml (macOS)
        if: ${{ !matrix.static }}
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: "5.x"

      - name: Build (macOS)
        if: ${{ !matrix.static }}
        run: |
          set -euo pipefail
          opam install . --deps-only
          opam exec -- dune build --profile release bin/wand.exe

      # What the release claims is that the binary runs where it is put. It
      # is checked here, from a directory with no wand tree above it, because
      # that is what a download does.
      - name: Check it runs where it is put
        run: |
          set -euo pipefail
          BIN="$PWD/_build/default/bin/wand.exe"
          file "$BIN"
          if [ "${{ matrix.static }}" = "true" ]; then
            # A dynamically linked binary would pass everything below on this
            # runner and fail on the user's machine. Read from `file` rather
            # than `ldd`, whose wording for a static binary differs between
            # the glibc host and the musl build. musl links these as PIE, so
            # `file` says "static-pie linked" -- still static, and still what
            # this is checking for.
            file "$BIN" | grep -qE "statically linked|static-pie linked" || {
              echo "expected a static binary" >&2
              exit 1
            }
          fi
          cd /tmp
          mkdir -p stdlib
          echo 'let length x = "hijacked"' > stdlib/List.wand
          # Each check reports what it got. A bare `test` that fails says
          # nothing, which costs a whole CI round trip to learn one string.
          check() {
            got=$("$BIN" -e "$1" 2>&1) && rc=0 || rc=$?
            if [ "$got" != "$2" ]; then
              echo "wand -e '$1'" >&2
              echo "  expected: $2" >&2
              echo "  got:      $got" >&2
              echo "  exit:     $rc" >&2
              exit 1
            fi
            echo "wand -e '$1' -> $got"
          }
          check '1 + 2' '3 : Int'
          check 'List.length [1,2]' '2 : Int'
          echo "runs from /tmp, ignores a decoy stdlib/"

      # Archives are a tag's business. A dispatch run builds and proves the
      # binary works, which is what it is for; naming an archive after a
      # branch only produces a `wand-main-...tar.gz` nobody should install.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The archive is named after the tag; the binary must agree, or
          # the box says one number and the tool inside it another.
          got="$(_build/default/bin/wand.exe version)"
          test "$got" = "wand $VERSION" \
            || { echo "the built binary reports '$got', not 'wand $VERSION'" >&2; exit 1; }
          NAME="wand-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp _build/default/bin/wand.exe "dist/$NAME/wand"
          chmod 755 "dist/$NAME/wand"
          cp LICENSE README.md "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          # Recorded from inside dist/, so the file names the archive rather
          # than a path that only existed on the runner -- `shasum -c` is run
          # next to the download, not here. Written by the binary this job
          # just built, which is the same arithmetic on every runner;
          # `shasum` and `sha256sum` are not the same binary.
          (cd dist && "$GITHUB_WORKSPACE/_build/default/bin/wand.exe" \
            "$GITHUB_WORKSPACE/tools/checksum.wand" "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -la dist

      # What the `.sha256` beside an archive cannot say: who built it.
      # That file is written by this job and uploaded beside the archive, so
      # anyone who can write the release can write both -- it authenticates
      # the download, not the publisher. The clobber incident recorded in
      # the Makefile went undetected for exactly that reason.
      #
      # An attestation is signed with a token this job cannot forge and
      # cannot pass on, and it records the repository, the workflow, the
      # commit and the archive's digest. A reader checks it with
      #
      #   gh attestation verify wand-X.Y.Z-<target>.tar.gz --repo wand-lang/wand
      #
      # which fails if the bytes are not the bytes this workflow built, at
      # this commit -- whoever attached them.
      #
      # Signed here rather than in the job that attaches the archives: the
      # release job downloads what these runners built, so an attestation
      # made there would name a job that built nothing.
      - name: Attest what this runner built
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Downloads artifacts and attaches them; minutes of real work.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # `gh` is on the runner, so this needs no third-party action.
      #
      # Create if absent, then upload. The macOS x86_64 archive is built on a
      # developer's Intel Mac by `make release` and attaches to this same
      # release, and neither side knows which of them will arrive first --
      # so both create-or-attach rather than assuming.
      #
      # A draft, because a release becomes public the moment it exists: left
      # undrafted, there is a window where someone downloads a release that
      # is missing their architecture. `gh release edit <tag> --draft=false`
      # publishes it once every archive is attached.
      - name: Attach the artifacts built here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
